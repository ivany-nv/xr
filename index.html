<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Device check-out</title>
<style>
  body { margin: 0; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         color: #1f2328; background: #fff; }
  main { max-width: 480px; margin: 0 auto; padding: 32px 16px; }
  a { color: #0969da; }
</style>
<script>
  // Short link → device check-out page.
  // QR / NFC content: https://<this page>/#<CODE>   (code is case-insensitive)
  // Only the target URL and the code table live here; the check-out page itself requires
  // NVIDIA Google sign-in. To add a device, add a line to CODES. If the Apps Script
  // deployment URL ever changes, update WEBAPP – printed labels keep working.
  var WEBAPP = 'https://script.google.com/a/macros/nvidia.com/s/AKfycbxvWIFAyPG3ra8ezFIOUKV3kmyYhoDXvntFrJe_YthN9Idseb4cIxLUt-979HAkw7c/exec';
  var CODES = {
    'P3': 'XR PICO3',
    'Q2': 'XR Q3 #2'
  };

  var raw = location.hash.slice(1) || new URLSearchParams(location.search).get('c') || '';
  var code;
  try { code = decodeURIComponent(raw); } catch (e) { code = raw; }
  code = code.trim().toUpperCase();
  var assetId = CODES[code];
  if (assetId) location.replace(WEBAPP + '?id=' + encodeURIComponent(assetId));
</script>
</head>
<body>
<main id="msg">
  <h1>Device check-out</h1>
  <p>Opening the device page…</p>
</main>
<script>
  if (!assetId) {
    document.getElementById('msg').innerHTML = code
      ? '<h1>Unknown device code</h1><p>No device for code “' +
        code.replace(/[^A-Z0-9-]/g, '') + '”. Scan the label again or contact your site owner.</p>'
      : '<h1>Device check-out</h1><p>Scan the QR code or tap the NFC tag on a device.</p>';
  } else {
    document.getElementById('msg').innerHTML += '<p>If nothing happens, <a href="' +
      WEBAPP + '?id=' + encodeURIComponent(assetId) + '">open it here</a>.</p>';
  }
</script>
</body>
</html>
